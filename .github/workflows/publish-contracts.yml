# Publishes SolPnl.Contracts (the plugin API) to nuget.org when a tag like contracts-v0.1.0 is pushed. The tag must
# match <SolPnlContractsVersion> in src/SolPnl.Contracts/SolPnl.Contracts.csproj.
#
# Uses nuget.org Trusted Publishing: no API key is stored. nuget.org has a trusted publishing policy for this repository
# and this workflow file (publish-contracts.yml), owned by the nuget.org account josephabreu-llc.
name: Publish SolPnl.Contracts

on:
  push:
    tags: ['contracts-v*']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # lets the job get a GitHub OIDC token for nuget.org's trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check the tag matches the package version
        run: |
          version=$(dotnet msbuild src/SolPnl.Contracts/SolPnl.Contracts.csproj -getProperty:PackageVersion)
          tag="${GITHUB_REF_NAME#contracts-v}"
          echo "Package version $version, tag $GITHUB_REF_NAME"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match <SolPnlContractsVersion> $version in SolPnl.Contracts.csproj."
            exit 1
          fi

      # Everything that uses the plugin API must still build and pass before it's published.
      - name: Build and test
        run: |
          dotnet build SolPnl.slnx -c Release
          dotnet test SolPnl.slnx -c Release --no-build --filter "Category!=Containers" --blame-hang-timeout 5m

      - name: Pack
        run: dotnet pack src/SolPnl.Contracts/SolPnl.Contracts.csproj -c Release -o artifacts/nuget -p:ContinuousIntegrationBuild=true

      - name: NuGet login (OIDC → short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: josephabreu-llc # nuget.org account (profile name) that owns the package and the policy

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/nuget/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json

      - uses: actions/upload-artifact@v4
        with:
          name: SolPnl.Contracts
          path: artifacts/nuget
